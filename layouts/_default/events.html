{{ define "main" }}
<h2>{{ .Title }}</h2>

<div id="calendar" class="events-calendar"></div>

<div class="events-list-section">
  <h3>Upcoming Events</h3>
  <ul id="events-list"></ul>
  <div class="sidebar-nav">
    <button id="prevEvents">&#8592;</button>
    <span id="pageIndicator"></span>
    <button id="nextEvents">&#8594;</button>
  </div>
</div>

<div class="events-list-section past-events-section">
  <button id="pastToggle" class="past-toggle">Show Past Events &#9662;</button>
  <div id="pastEventsWrap" style="display:none;">
    <h3>Past Events</h3>
    <ul id="past-events-list"></ul>
    <div class="sidebar-nav">
      <button id="prevPastEvents">&#8592;</button>
      <span id="pastPageIndicator"></span>
      <button id="nextPastEvents">&#8594;</button>
    </div>
  </div>
</div>

<script id="events-data" type="application/json">
  {{ .Site.Data.events | jsonify }}
</script>
{{ $calendarJS := resources.Get "js/calendar.js" }}
<script src="{{ $calendarJS.RelPermalink }}"></script>

<script>
(function() {
  let events = JSON.parse(document.getElementById('events-data').textContent);
  if (typeof events === 'string') {
    events = JSON.parse(events);
  }
  events.sort((a, b) => a.date.localeCompare(b.date));

  const todayStr = new Date().toISOString().split('T')[0];

  function colorFor(title) {
    if (title === 'General Club Meeting') return '#fc79b0';
    if (title === 'Weekly Study Group' || title === 'First Weekly Study Group') return '#cafc79';
    if (title === 'Unity Day') return '#e02e2d';
    return '#dddddd';
  }

  function formatDate(dateStr) {
    const [year, month, day] = dateStr.split('-');
    return `${month}-${day}-${year}`;
  }

  function groupByDate(list) {
    const grouped = [];
    const byDate = {};
    list.forEach(e => {
      if (!byDate[e.date]) {
        byDate[e.date] = [];
        grouped.push(byDate[e.date]);
      }
      byDate[e.date].push(e);
    });
    return grouped;
  }

  function makePaginator(listElId, prevId, nextId, indicatorId, grouped) {
    const perPage = 3;
    let currentPage = 0;
    const totalPages = Math.max(1, Math.ceil(grouped.length / perPage));

    function renderPage() {
      const list = document.getElementById(listElId);
      list.innerHTML = '';
      const start = currentPage * perPage;
      const pageGroups = grouped.slice(start, start + perPage);

      pageGroups.forEach(group => {
        const li = document.createElement('li');
        let html = `<strong>${formatDate(group[0].date)}</strong><div>`;
        group.forEach(e => {
          html += `<div class="event-entry"><span class="event-color-dot" style="background-color:${colorFor(e.title)};"></span>${e.title}<br><small>${e.time} &mdash; ${e.location}</small></div>`;
        });
        html += `</div>`;
        li.innerHTML = html;
        list.appendChild(li);
      });

      document.getElementById(indicatorId).textContent = `${currentPage + 1} / ${totalPages}`;
      document.getElementById(prevId).disabled = currentPage === 0;
      document.getElementById(nextId).disabled = currentPage >= totalPages - 1;
    }

    document.getElementById(prevId).addEventListener('click', () => {
      if (currentPage > 0) {
        currentPage--;
        renderPage();
      }
    });

    document.getElementById(nextId).addEventListener('click', () => {
      if (currentPage < totalPages - 1) {
        currentPage++;
        renderPage();
      }
    });

    renderPage();
  }

  const upcomingEvents = events.filter(e => e.date >= todayStr);
  const pastEvents = events.filter(e => e.date < todayStr).reverse();

  const upcomingGrouped = groupByDate(upcomingEvents);
  const pastGrouped = groupByDate(pastEvents);

  makePaginator('events-list', 'prevEvents', 'nextEvents', 'pageIndicator', upcomingGrouped);
  makePaginator('past-events-list', 'prevPastEvents', 'nextPastEvents', 'pastPageIndicator', pastGrouped);

  const toggle = document.getElementById('pastToggle');
  const wrap = document.getElementById('pastEventsWrap');
  toggle.addEventListener('click', () => {
    const isOpen = wrap.style.display !== 'none';
    wrap.style.display = isOpen ? 'none' : 'block';
    toggle.innerHTML = isOpen ? 'Show Past Events &#9662;' : 'Hide Past Events &#9652;';
  });
})();
</script>

{{ end }}
