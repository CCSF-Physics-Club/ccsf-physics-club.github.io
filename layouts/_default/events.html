{{ define "main" }}
<h2>{{ .Title }}</h2>

<div id="calendar" class="events-calendar"></div>

<div class="events-list-section">
  <h3>Upcoming Events</h3>
  <ul id="events-list"></ul>
  <div class="sidebar-nav">
    <button id="prevEvents">&#8592;</button>
    <span id="pageIndicator"></span>
    <button id="nextEvents">&#8594;</button>
  </div>
</div>

<script id="events-data" type="application/json">
  {{ .Site.Data.events | jsonify }}
</script>
{{ $calendarJS := resources.Get "js/calendar.js" }}
<script src="{{ $calendarJS.RelPermalink }}"></script>

<script>
(function() {
  let events = JSON.parse(document.getElementById('events-data').textContent);
  if (typeof events === 'string') {
    events = JSON.parse(events);
  }
  events.sort((a, b) => a.date.localeCompare(b.date));

  const grouped = [];
  const byDate = {};
  events.forEach(e => {
    if (!byDate[e.date]) {
      byDate[e.date] = [];
      grouped.push(byDate[e.date]);
    }
    byDate[e.date].push(e);
  });

  const perPage = 3;
  let currentPage = 0;
  const totalPages = Math.ceil(grouped.length / perPage);

  function formatDate(dateStr) {
    const [year, month, day] = dateStr.split('-');
    return `${month}-${day}-${year}`;
  }

  function renderPage() {
    const list = document.getElementById('events-list');
    list.innerHTML = '';
    const start = currentPage * perPage;
    const pageGroups = grouped.slice(start, start + perPage);

   function colorFor(title) {
      if (title === 'General Club Meeting') return '#fc79b0';
      if (title === 'Weekly Study Group') return '#cafc79';
      if (title === 'Unity Day') return '#e02e2d';
      return '#dddddd';
    }

    pageGroups.forEach(group => {
      const li = document.createElement('li');
      let html = `<strong>${formatDate(group[0].date)}</strong><div>`;
      group.forEach(e => {
        html += `<div class="event-entry"><span class="event-color-dot" style="background-color:${colorFor(e.title)};"></span>${e.title}<br><small>${e.time} &mdash; ${e.location}</small></div>`;
      });
      html += `</div>`;
      li.innerHTML = html;
      list.appendChild(li);
    });

    document.getElementById('pageIndicator').textContent = `${currentPage + 1} / ${totalPages}`;
    document.getElementById('prevEvents').disabled = currentPage === 0;
    document.getElementById('nextEvents').disabled = currentPage === totalPages - 1;
  }

  document.getElementById('prevEvents').addEventListener('click', () => {
    if (currentPage > 0) {
      currentPage--;
      renderPage();
    }
  });

  document.getElementById('nextEvents').addEventListener('click', () => {
    if (currentPage < totalPages - 1) {
      currentPage++;
      renderPage();
    }
  });

  renderPage();
})();
</script>

{{ end }}
