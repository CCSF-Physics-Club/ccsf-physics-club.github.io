<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>

  <header style="text-align: center;">
    <div class="header-top">
      <h1><a href="{{ "/" | relURL }}">{{ .Site.Title }}</a></h1>
      <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <p id="live-clock" style="font-size: 0.8rem; letter-spacing: 1px; color: #111111; margin: 0.5rem 0 0;"></p>
<nav class="nav-grid" style="justify-content: center;">
      <a href="{{ "/" | relURL }}">Home</a>
      <a href="{{ "/rules/" | relURL }}">Rules</a>
      <a href="{{ "/events/" | relURL }}">Events</a>
      <a href="{{ "/join/" | relURL }}">Join</a>
      <a href="{{ "/about/" | relURL }}">About</a>
    </nav>
    <nav class="mobile-nav" id="mobile-nav">
      <a href="{{ "/" | relURL }}">Home</a>
      <a href="{{ "/rules/" | relURL }}">Rules</a>
      <a href="{{ "/events/" | relURL }}">Events</a>
      <a href="{{ "/join/" | relURL }}">Join</a>
      <a href="{{ "/about/" | relURL }}">About</a>
    </nav>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer>
    <p>&copy; {{ now.Year }} {{ .Site.Title }}</p>
  </footer>

  <script>
  (function() {
    function ordinal(n) {
      const s = ["th", "st", "nd", "rd"];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    function updateClock() {
      const now = new Date();

      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Los_Angeles',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      }).formatToParts(now);

      const map = {};
      parts.forEach(p => map[p.type] = p.value);

      const dayNum = parseInt(map.day, 10);
      const dayText = ordinal(dayNum);
      const monthText = map.month;
      const yearText = map.year;
      const timeText = `${map.hour}:${map.minute}:${map.second} ${map.dayPeriod}`;

     const el = document.getElementById('live-clock');
      if (el) {
        el.innerHTML = `Today is ${monthText} ${dayText}, ${yearText}<br>It is ${timeText}`;
      }
    }

    updateClock();
    setInterval(updateClock, 1000);
  })();

  (function() {
    const toggle = document.getElementById('menu-toggle');
    const mobileNav = document.getElementById('mobile-nav');
    if (!toggle || !mobileNav) return;

    toggle.addEventListener('click', function() {
      const isOpen = mobileNav.classList.toggle('open');
      toggle.classList.toggle('open', isOpen);
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  })();
  </script>

</body>
</html>
