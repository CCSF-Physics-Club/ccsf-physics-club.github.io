{{ with hugo.Data.potw }}
{{ $latest := index (sort . "date" "desc") 0 }}
<section class="potw-section">
  <div class="section-head">
    <h3>Problem of the Week</h3>
  </div>
  <div class="potw-band">
    <a class="potw-photo" href="{{ $latest.image | relURL }}" target="_blank">
      <img src="{{ $latest.image | relURL }}" alt="{{ $latest.alt | default "Problem of the week" }}">
    </a>
    <div class="potw-text">
      <p class="potw-week">Week of {{ time.Format "January 2" $latest.date }}</p>
      {{ with $latest.caption }}<div class="potw-caption">{{ . | safeHTML }}</div>{{ end }}
      <p class="potw-hint">Tap the photo to enlarge.</p>
    </div>
  </div>
</section>
{{ end }}
